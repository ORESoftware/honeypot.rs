[package]
name = "honeypot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Low-interaction Rust deception service with privacy-minimized telemetry"
license = "Apache-2.0"
repository = "https://github.com/ORESoftware/honeypot.rs"
publish = false

[dependencies]
axum = { version = "=0.8.4", features = ["http2", "json", "macros"] }
hex = "=0.4.3"
hmac = "=0.12.1"
ipnet = "=2.11.0"
leptos = { version = "=0.8.2", default-features = false, features = ["ssr"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.6.6", features = ["catch-panic", "limit", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
