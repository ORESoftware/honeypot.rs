name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: honeypot-rs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-api-mismatches-once:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-3873-honeypot-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/den-3873-honeypot-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the reviewed Axum and Leptos API corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str, expected: int) -> None:
              global text
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"expected {expected} occurrences of {old!r}, found {actual}"
                  )
              text = text.replace(old, new)

          replace_exact(
              "    future::pending,\n",
              "    convert::Infallible,\n    future::pending,\n",
              1,
          )
          replace_exact(
              "    extract::{ConnectInfo, Request, State},\n",
              "    extract::{ConnectInfo, FromRequestParts, Request, State},\n",
              1,
          )
          replace_exact(
              "    http::{HeaderMap, HeaderValue, Method, StatusCode, Uri, header},\n",
              "    http::{HeaderMap, HeaderValue, Method, StatusCode, Uri, header, request::Parts},\n",
              1,
          )
          replace_exact(
              "type HmacSha256 = Hmac<Sha256>;\n",
              """type HmacSha256 = Hmac<Sha256>;

#[derive(Clone, Copy, Debug)]
struct PeerAddr(Option<SocketAddr>);

impl<S> FromRequestParts<S> for PeerAddr
where
    S: Send + Sync,
{
    type Rejection = Infallible;

    async fn from_request_parts(
        parts: &mut Parts,
        _state: &S,
    ) -> Result<Self, Self::Rejection> {
        Ok(Self(
            parts
                .extensions
                .get::<ConnectInfo<SocketAddr>>()
                .map(|connect_info| connect_info.0),
        ))
    }
}
""",
              1,
          )
          replace_exact(
              "leptos::ssr::render_to_string",
              "leptos::prelude::ssr::render_to_string",
              2,
          )
          replace_exact(
              "header::PERMISSIONS_POLICY",
              "axum::http::HeaderName::from_static(\"permissions-policy\")",
              1,
          )
          replace_exact(
              "connect: Option<ConnectInfo<SocketAddr>>",
              "PeerAddr(peer): PeerAddr",
              8,
          )
          replace_exact("connect.map(|value| value.0)", "peer", 8)

          path.write_text(text, encoding="utf-8")
          PY
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
          cargo fmt --all
          git diff --check
      - name: Commit only the corrected application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/main.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No API-correction changes were staged.' >&2
            exit 1
          fi
          git commit -m 'fix(DEN-3873): align Axum and Leptos APIs'
          git push origin HEAD:refs/heads/agent/den-3873-honeypot-foundation

  rust-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.88.0
      - name: Validate repository policy
        run: python3 scripts/validate.py
      - name: Generate dependency lock for reproducible checks
        run: cargo generate-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Reject accidental credential material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- ': (ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- ':!README.md' ':!src/main.rs'; then
            echo 'credential-shaped material found' >&2
            exit 1
          fi

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build OCI image
        run: docker build --tag honeypot-rs:ci .
      - name: Inspect non-root runtime declaration
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect honeypot-rs:ci --format '{{.Config.User}}')" = 65532:65532
          test "$(docker image inspect honeypot-rs:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/honeypot-rs"]'
