name: Verify final DEN-3873 honeypot foundation

on:
  push:
    branches:
      - agent/den-3873-honeypot-foundation
    paths:
      - .github/workflows/verify-den-3873-final.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: den-3873-leptos-ssr-repair
  cancel-in-progress: false

jobs:
  verify-final-head:
    if: >-
      github.repository == 'ORESoftware/honeypot.rs' &&
      github.ref == 'refs/heads/agent/den-3873-honeypot-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the latest exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3873-honeypot-foundation
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Idempotently normalize the two Leptos SSR paths
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('build.rs')
          text = path.read_text(encoding='utf-8')
          bad = 'leptos::prelude::ssr::'
          count = text.count(bad)
          if count not in (0, 2):
              raise SystemExit(f'unexpected invalid namespace count: {count}')
          if count:
              path.write_text(text.replace(bad, 'leptos::ssr::'), encoding='utf-8')
          PY
          git diff --check -- build.rs
          ! grep -F 'leptos::prelude::ssr::' build.rs
          grep -F 'leptos::ssr::render_to_string' build.rs >/dev/null
          grep -F 'leptos::ssr::render_to_stream_with_prefix_undisposed_with_context' build.rs >/dev/null

      - name: Run exact full validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo build --workspace --locked
          python3 scripts/check-k8s.py deploy/k8s
          bash scripts/check-policy.sh
          bash scripts/check-secrets.sh
          bash scripts/check-api-compat.sh

      - name: Remove transient workflows and publish the validated head
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- \
            .github/workflows/fix-den-3873-leptos-ssr.yml \
            .github/workflows/verify-den-3873-final.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- build.rs
          git add -u -- \
            .github/workflows/fix-den-3873-leptos-ssr.yml \
            .github/workflows/verify-den-3873-final.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(DEN-3873): validate final Leptos SSR foundation'
            git push origin 'HEAD:agent/den-3873-honeypot-foundation'
          fi
          final_sha="$(git rev-parse HEAD)"
          [[ "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'final_sha=%s\n' "$final_sha" >> "$GITHUB_OUTPUT"

      - name: Record sanitized exact validation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          set -Eeuo pipefail
          body="DEN-3873 final verifier passed on \`${FINAL_SHA}\`: Rust formatting, Clippy with warnings denied, all-target locked tests, locked build, Kubernetes validation, policy checks, secret scan, and API compatibility all succeeded. The verifier removed its transient workflow before publishing this head. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -f body="$body" \
            >/dev/null
