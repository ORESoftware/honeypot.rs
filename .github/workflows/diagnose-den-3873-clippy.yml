name: Diagnose DEN-3873 Clippy failure

on:
  push:
    branches:
      - agent/den-3873-honeypot-foundation
    paths:
      - .github/workflows/diagnose-den-3873-clippy.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: den-3873-clippy-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.repository == 'ORESoftware/honeypot.rs' &&
      github.ref == 'refs/heads/agent/den-3873-honeypot-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3873-honeypot-foundation
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Capture bounded Clippy output
        id: clippy
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/clippy.log"
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings >"$log" 2>&1
          status=$?
          set -e
          python3 - "$log" "$RUNNER_TEMP/clippy-tail.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          text = '\n'.join(source[-180:])
          patterns = [
              r'ghp_[A-Za-z0-9]{20,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'lin_api_[A-Za-z0-9]{20,}',
              r'AKIA[0-9A-Z]{16}',
          ]
          for pattern in patterns:
              text = re.sub(pattern, '[REDACTED]', text)
          Path(sys.argv[2]).write_text(text + '\n', encoding='utf-8')
          PY
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Post sanitized diagnostic evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLIPPY_STATUS: ${{ steps.clippy.outputs.status }}
        run: |
          set -Eeuo pipefail
          tail_file="$RUNNER_TEMP/clippy-tail.txt"
          body_file="$RUNNER_TEMP/comment.md"
          {
            printf 'DEN-3873 bounded Clippy diagnostic on `%s` exited with status `%s`.\n\n' "$GITHUB_SHA" "$CLIPPY_STATUS"
            printf '```text\n'
            cat "$tail_file"
            printf '```\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$body_file"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -F body="$(cat "$body_file")" \
            >/dev/null

      - name: Remove transient diagnostic workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/diagnose-den-3873-clippy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .github/workflows/diagnose-den-3873-clippy.yml
          git diff --cached --check
          git commit -m 'chore(DEN-3873): remove transient Clippy diagnostic'
          git push origin 'HEAD:agent/den-3873-honeypot-foundation'
