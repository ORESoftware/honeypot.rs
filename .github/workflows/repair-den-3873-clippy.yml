name: Repair DEN-3873 Clippy findings

on:
  push:
    branches:
      - agent/den-3873-honeypot-foundation
    paths:
      - .github/workflows/repair-den-3873-clippy.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: den-3873-clippy-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ORESoftware/honeypot.rs' &&
      github.ref == 'refs/heads/agent/den-3873-honeypot-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3873-honeypot-foundation
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply only machine-applicable Clippy suggestions
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --fix \
            --workspace \
            --all-targets \
            --all-features \
            --allow-dirty \
            --allow-staged
          cargo fmt --all

          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            >"$RUNNER_TEMP/clippy-after-fix.log" 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Post bounded diagnostics when automatic repair is insufficient
        if: steps.repair.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/clippy-after-fix.log" "$RUNNER_TEMP/clippy-tail.txt" <<'PY'
          from pathlib import Path
          import re
          import sys

          lines = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          text = '\n'.join(lines[-180:])
          for pattern in (
              r'ghp_[A-Za-z0-9]{20,}',
              r'github_pat_[A-Za-z0-9_]{20,}',
              r'lin_api_[A-Za-z0-9]{20,}',
              r'AKIA[0-9A-Z]{16}',
          ):
              text = re.sub(pattern, '[REDACTED]', text)
          Path(sys.argv[2]).write_text(text + '\n', encoding='utf-8')
          PY
          body_file="$RUNNER_TEMP/comment.md"
          {
            printf 'DEN-3873 automatic Clippy repair could not resolve every finding on `%s`. No source repair was published.\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat "$RUNNER_TEMP/clippy-tail.txt"
            printf '```\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$body_file"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -F body="$(cat "$body_file")" \
            >/dev/null

      - name: Run complete validation after successful lint repair
        if: steps.repair.outputs.status == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --all-features --locked
          cargo build --workspace --locked
          python3 scripts/check-k8s.py deploy/k8s
          bash scripts/check-policy.sh
          bash scripts/check-secrets.sh
          bash scripts/check-api-compat.sh

      - name: Publish validated repair and remove transient workflows
        if: steps.repair.outputs.status == '0'
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- \
            .github/workflows/diagnose-den-3873-clippy.yml \
            .github/workflows/repair-den-3873-clippy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- build.rs src Cargo.toml Cargo.lock
          git add -u -- \
            .github/workflows/diagnose-den-3873-clippy.yml \
            .github/workflows/repair-den-3873-clippy.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Clippy reported success but no repair or cleanup change was staged.' >&2
            exit 1
          fi
          git commit -m 'fix(DEN-3873): apply validated Clippy repairs'
          git push origin 'HEAD:agent/den-3873-honeypot-foundation'
          final_sha="$(git rev-parse HEAD)"
          printf 'final_sha=%s\n' "$final_sha" >> "$GITHUB_OUTPUT"

      - name: Record successful exact validation
        if: steps.repair.outputs.status == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -f body="DEN-3873 Clippy repair and full validation passed on \`${FINAL_SHA}\`: formatting, Clippy with warnings denied, locked all-target tests/build, Kubernetes validation, policy checks, secret scan, and API compatibility succeeded. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

      - name: Remove unsuccessful transient workflow without source changes
        if: steps.repair.outputs.status != '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          rm -f -- \
            .github/workflows/diagnose-den-3873-clippy.yml \
            .github/workflows/repair-den-3873-clippy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- \
            .github/workflows/diagnose-den-3873-clippy.yml \
            .github/workflows/repair-den-3873-clippy.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(DEN-3873): remove transient Clippy workflows'
            git push origin 'HEAD:agent/den-3873-honeypot-foundation'
          fi
