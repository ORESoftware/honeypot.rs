apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honeypot-rs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: honeypot-rs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 8080
  egress: []
